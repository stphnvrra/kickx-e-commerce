{% extends "base.html" %}

{% block title %}Register - Kickx{% endblock %}

{% block content %}
<div class="pt-4">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-sm" style="border-radius: 24px; background: #ffffff; border: 1px solid #e2e8f0;">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <h2 class="fw-bold mb-1" style="font-family: 'Outfit'; color: #0f172a;">Create Account</h2>
                        <p class="text-muted small">Join the KickX premium marketplace</p>
                    </div>
                    
                    <form method="POST" action="{{ url_for('register') }}">
                        
                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold" style="font-size: 0.9rem; color: #475569;">Email Address</label>
                            <input type="email" class="form-control rounded-3" id="email" name="email" required style="padding: 12px 16px; border-color: #cbd5e1; font-size: 0.95rem;">
                        </div>

                        <div class="mb-3">
                            <label for="username" class="form-label fw-semibold" style="font-size: 0.9rem; color: #475569;">Username</label>
                            <input type="text" class="form-control rounded-3" id="username" name="username" required style="padding: 12px 16px; border-color: #cbd5e1; font-size: 0.95rem;">
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="first_name" class="form-label fw-semibold" style="font-size: 0.9rem; color: #475569;">First Name</label>
                                <input type="text" class="form-control rounded-3" id="first_name" name="first_name" required style="padding: 12px 16px; border-color: #cbd5e1; font-size: 0.95rem;">
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="last_name" class="form-label fw-semibold" style="font-size: 0.9rem; color: #475569;">Last Name</label>
                                <input type="text" class="form-control rounded-3" id="last_name" name="last_name" required style="padding: 12px 16px; border-color: #cbd5e1; font-size: 0.95rem;">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label fw-semibold" style="font-size: 0.9rem; color: #475569;">Password</label>
                            <input type="password" class="form-control rounded-3" id="password" name="password" required style="padding: 12px 16px; border-color: #cbd5e1; font-size: 0.95rem;">
                        </div>

                        <div class="mb-4">
                            <label for="confirm_password" class="form-label fw-semibold" style="font-size: 0.9rem; color: #475569;">Confirm Password</label>
                            <input type="password" class="form-control rounded-3" id="confirm_password" name="confirm_password" required style="padding: 12px 16px; border-color: #cbd5e1; font-size: 0.95rem;">
                        </div>
                        
                        <div class="d-grid mb-3">
                            <button type="submit" class="btn btn-primary py-3 fw-bold rounded-3" style="background: #EC5228; border: none; font-family: 'Outfit'; font-size: 1.05rem; transition: all 0.3s;">Create Account</button>
                        </div>
                    </form>
                    
                    <div class="text-center mt-3">
                        <p class="mb-0 small text-muted">
                            Already have an account? <a href="{{ url_for('login') }}" class="text-decoration-none fw-bold" style="color: #EC5228;">Login</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_css %}
<style>
.form-control:focus {
    border-color: #EC5228 !important;
    box-shadow: 0 0 0 3px rgba(236, 82, 40, 0.15) !important;
}
</style>
{% endblock %}
